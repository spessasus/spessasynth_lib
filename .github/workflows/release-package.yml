name: Publish the npm package

on:
    push:
        tags:
            - "v*"

permissions:
    contents: read

concurrency:
    group: "npm-publish"
    cancel-in-progress: false

jobs:
    checks:
        uses: ./.github/workflows/pr-checks.yml
        permissions:
            contents: read

    publish-npm:
        needs: checks
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Check the tag matches package.json
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  VERSION="v$(node -p "require('./package.json').version")"
                  if [ "$VERSION" != "$TAG" ]; then
                      echo "Tag $TAG does not match package.json version $VERSION"
                      exit 1
                  fi

            - name: Install dependencies
              run: npm ci

            - name: Build and publish to npm registry
              run: npm publish --provenance --access public

    create-release:
        needs: publish-npm
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Get previous release tag
              id: prev-tag
              run: |
                  TAG="${GITHUB_REF#refs/tags/}"
                  PREV_TAG=$(git tag --sort=-version:refname | grep -A1 "^${TAG}$" | tail -1)
                  if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$TAG" ]; then
                      PREV_TAG=$(git rev-list --max-parents=0 HEAD | head -1)
                      echo "is_first=true" >> "$GITHUB_OUTPUT"
                  fi
                  echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
                  echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

            - name: Generate release notes
              env:
                  TAG: ${{ steps.prev-tag.outputs.tag }}
                  PREV_TAG: ${{ steps.prev-tag.outputs.prev_tag }}
                  IS_FIRST: ${{ steps.prev-tag.outputs.is_first }}
              run: |
                  notes() {
                      for commit in $(git rev-list "$1"); do
                          echo "- $(git log -1 --format=%B "$commit" | head -n 1) (\`$(git log -1 --format=%h "$commit")\`)"
                      done
                  }

                  {
                      echo "## What's Changed"
                      echo ""
                      if [ "$IS_FIRST" = "true" ]; then
                          if git rev-parse -q --verify HEAD^ > /dev/null; then
                              notes HEAD^
                          else
                              notes HEAD
                          fi
                      else
                          notes "${PREV_TAG}..${TAG}^"
                      fi
                      echo ""
                      echo "---"
                      echo ""
                      echo "Please note that **only the latest version of spessasynth_lib is supported.**"
                      echo ""
                      echo "Please make sure you are up to date before reporting issues."
                  } > release_body.md

            - name: Create GitHub Release
              uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
              with:
                  tag_name: ${{ github.ref_name }}
                  body_path: release_body.md
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
